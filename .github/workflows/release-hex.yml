name: Release to HEX
on:
  workflow_call:
    inputs:
      related-repositories:
        description: Comma-separated or newline-separated repository names in the caller organization requiring read access.
        type: string
        required: false
        default: ""
      cache_paths:
        type: string
        required: false
        default: ""
      elixir-version:
        type: string
        required: false
        default: "1.14.3" # Define the elixir version
      otp-version:
        type: string
        required: false
        default: "25.1" # Define the OTP version
      mix-env:
        type: string
        required: false
        default: test
      elixir-code-path:
        type: string
        required: false
        default: "."
    secrets:
      RO_APP_ID:
        required: false
      RO_APP_KEY:
        required: false
      HEX_ORGANIZATION_COINGAMING_KEY:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MIX_ENV: ${{ inputs.mix-env }}

jobs:
  build:
    name: Build
    uses: coingaming/.github/.github/workflows/build.yml@v1.4.6
    secrets: inherit
    with:
      related-repositories: ${{ inputs.related-repositories }}
      mix-env: ${{ inputs.mix-env }}
      cache_paths: ${{ inputs.cache_paths }}
      elixir-version: ${{ inputs.elixir-version }}
      otp-version: ${{ inputs.otp-version }}
      elixir-code-path: ${{ inputs.elixir-code-path }}

  release:
    name: Release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.elixir-code-path }}

    env:
      MIX_ENV: ${{ inputs.mix-env }}
      HEX_API_KEY: ${{ secrets.HEX_ORGANIZATION_COINGAMING_KEY }}

    steps:
      - name: Prepare repo and env
        uses: coingaming/.github/actions/prepare@v1.4.6
        with:
          mix-env: ${{ inputs.mix-env }}
          cache_paths: ${{ inputs.cache_paths }}
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}
          elixir-code-path: ${{ inputs.elixir-code-path }}
          related-repositories: ${{ inputs.related-repositories }}
          ro-app-id: ${{ secrets.RO_APP_ID }}
          ro-app-key: ${{ secrets.RO_APP_KEY }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.10.0

      - name: Add NPM Registry
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: Install Semantic Release
        run: npm install semantic-release @semantic-release/git @semantic-release/exec @semantic-release/changelog @heathmont/semantic-release-elixir-hex

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release --extends @heathmont/semantic-release-elixir-hex
