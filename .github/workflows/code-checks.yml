name: Compile and check
on:
  workflow_call:
    inputs:
      related-repositories:
        description: Comma-separated or newline-separated repository names in the caller organization requiring read access.
        type: string
        required: false
        default: ""
      cache_paths:
        type: string
        required: false
        default: ""
      elixir-version:
        type: string
        required: false
        default: "1.14.3" # Define the elixir version
      otp-version:
        type: string
        required: false
        default: "25.1" # Define the OTP version
      mix-env:
        type: string
        required: false
        default: test
      check-format:
        type: boolean
        required: false
        default: true
      check-credo:
        type: boolean
        required: false
        default: true
      check-warnings:
        type: boolean
        required: false
        default: true
      elixir-code-path:
        type: string
        required: false
        default: "."
    secrets:
      RO_APP_ID:
        required: false
      RO_APP_KEY:
        required: false
      HEX_ORGANIZATION_COINGAMING_KEY:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MIX_ENV: ${{ inputs.mix-env }}

jobs:
  build:
    name: Build
    uses: coingaming/.github/.github/workflows/build.yml@v1.4.7
    secrets: inherit
    with:
      related-repositories: ${{ inputs.related-repositories }}
      mix-env: ${{ inputs.mix-env }}
      cache_paths: ${{ inputs.cache_paths }}
      elixir-version: ${{ inputs.elixir-version }}
      otp-version: ${{ inputs.otp-version }}
      elixir-code-path: ${{ inputs.elixir-code-path }}


  code_checks:
    name: Run code checks
    needs: build
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.elixir-code-path }}

    steps:
      - name: Prepare repo and env
        uses: coingaming/.github/actions/prepare@v1.4.7
        with:
          mix-env: ${{ inputs.mix-env }}
          cache_paths: ${{ inputs.cache_paths }}
          elixir-version: ${{ inputs.elixir-version }}
          otp-version: ${{ inputs.otp-version }}
          related-repositories: ${{ inputs.related-repositories }}
          ro-app-id: ${{ secrets.RO_APP_ID }}
          ro-app-key: ${{ secrets.RO_APP_KEY }}
          elixir-code-path: ${{ inputs.elixir-code-path }}


      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Format
        if: ${{ inputs.check-format }}
        run: mix format --check-formatted

      - name: Credo
        if: ${{ inputs.check-credo }}
        run: mix credo

      - name: Compile and check warnings
        if: ${{ inputs.check-warnings }}
        run: mix do clean, compile --warnings-as-errors
